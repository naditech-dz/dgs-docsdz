<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1520">

<title>DGS DOCS</title>
<style>:root{--bg:#0f1520;--card:#182131;--card2:#1f2a3d;--line:#2b3850;--tx:#eef1f6;--mut:#93a0b6;--gold:#d4a937;--gold2:#ad8c22;--ok:#2fb36d;--warn:#e0a526;--err:#e5534b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:90px;max-width:720px;margin:0 auto}
a{color:var(--gold);text-decoration:none}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));background:rgba(15,21,32,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top h1{flex:1;margin:0;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#111;font-weight:800;border-radius:8px;padding:4px 8px;font-size:14px;letter-spacing:.5px}
.back{font-size:30px;line-height:24px;padding:0 8px 4px 0;color:var(--gold)}
.ico{font-size:20px;padding:4px}
.tabs{display:flex;gap:6px;padding:12px 12px 4px;overflow-x:auto}
.tabs button{flex:1;min-width:84px;background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:12px;padding:9px 6px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button small{font-size:11px;opacity:.8}.tabs button.on{border-color:var(--gold);color:var(--tx);background:var(--card2)}
.searchrow,.sec>input[type=search]{padding:8px 12px}
input,select,textarea{width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--gold)}
.list,.sec{padding:0 12px}
.sec{margin-top:18px}.sec h3{margin:0 0 8px;font-size:15px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:8px}
.sec h3 small{font-weight:400;text-transform:none}.mini{margin-left:auto;font-size:13px;text-transform:none;letter-spacing:0}
.item,.doc,.next{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;color:var(--tx)}
.item.sm{padding:9px 12px}.av{font-size:22px;width:38px;height:38px;border-radius:10px;background:var(--card2);display:grid;place-items:center}
.tx{flex:1;min-width:0;display:flex;flex-direction:column}.tx b{font-weight:600;overflow:hidden;text-overflow:ellipsis}.tx small{color:var(--mut);font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--mut);font-size:22px}.st{font-size:16px}
.next{border-color:var(--gold);background:linear-gradient(90deg,rgba(212,169,55,.12),var(--card))}.next>span:first-child{color:var(--gold);font-size:20px}
.fab{position:fixed;right:max(18px,calc(50% - 342px));bottom:max(22px,env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#111;font-size:32px;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.empty{text-align:center;color:var(--mut);padding:36px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px}
.card h2{margin:0 0 6px;font-size:19px}.card.slim{padding:10px 14px}.card.warn{border-color:var(--warn);background:rgba(224,165,38,.1)}.card.ok{border-color:var(--ok);background:rgba(47,179,109,.1)}.card.err{border-color:var(--err);background:rgba(229,83,75,.1)}
.chip{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:3px 10px;margin:2px 6px 2px 0;font-size:13px;color:var(--tx)}.chip.s{font-size:12px}
.kvs{margin-top:8px}.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--line)}.kv span{color:var(--mut);font-size:13px}.kv b{font-weight:500;text-align:right}
.form{padding:0 12px}.fld{display:block;margin:12px 0}.fld>span{display:block;font-size:13px;color:var(--mut);margin-bottom:5px}.fld em{font-style:normal;color:var(--gold);font-size:11.5px}.fld em.inh{color:var(--ok)}
.hh{margin:18px 0 4px;font-size:15px;color:var(--gold)}.hh small{color:var(--mut)}
.grp{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:8px 0;overflow:hidden}.grp>summary{padding:12px 14px;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}.grp>summary::-webkit-details-marker{display:none}
.grp>summary small{color:var(--mut);font-weight:400}.grp .doc{margin:0;border-radius:0;border-width:1px 0 0;background:transparent}.grp .inner{padding:0 12px 10px}
.chk{display:flex;gap:10px;align-items:center;margin:16px 0;color:var(--mut);font-size:14px}
.actions{display:flex;gap:10px;margin:18px 12px}.form .actions{margin:20px 0}.actions.col{flex-direction:column}.row2{display:flex;gap:10px}.row2>*{flex:1}
.btn{display:block;text-align:center;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:13px 16px;font:inherit;font-weight:600;flex:1}
.btn.primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#111;border:0}.btn.big{padding:16px;font-size:18px}.btn.danger{color:var(--err);border-color:rgba(229,83,75,.5)}
.pages{display:flex;flex-direction:column;gap:12px}.pg{width:100%;border-radius:6px;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.note{color:var(--mut);font-size:12.5px;margin:10px 0}.miss{margin-top:8px;color:var(--warn);font-size:13px}.log{font-size:12px;color:var(--mut);background:var(--card);border-radius:10px;padding:10px;max-height:260px;overflow:auto}
.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);background:#000c;color:#fff;border:1px solid var(--line);padding:11px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:100;max-width:90%;text-align:center;font-size:14px}.toast.show{opacity:1;transform:translate(-50%,0)}
.busy{position:fixed;inset:0;background:rgba(5,8,14,.82);z-index:99;display:grid;place-items:center}.busybox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(320px,86%);text-align:center}
.spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--gold);border-radius:50%;margin:0 auto 12px;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.bar{height:6px;background:var(--line);border-radius:4px;margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
.ctx{display:block;color:#8a97ab;font-size:12px;margin:2px 0 4px}.ctx b{color:#f0b429}
</style>

/* ============ IndexedDB ============ */
const DB = {
  _db: null,
  async open() {
    if (this._db) return this._db;
    this._db = await new Promise((res, rej) => {
      const r = indexedDB.open('dgsdocs', 1);
      r.onupgradeneeded = () => { const d = r.result; ['kv', 'templates', 'entities', 'docs'].forEach(s => d.createObjectStore(s)); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return this._db;
  },
  async tx(store, mode, fn) {
    const d = await this.open();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode); const s = t.objectStore(store);
      let out; Promise.resolve(fn(s)).then(v => out = v);
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  req(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  get(store, k) { return this.tx(store, 'readonly', s => this.req(s.get(k))); },
  put(store, k, v) { return this.tx(store, 'readwrite', s => { s.put(v, k); }); },
  del(store, k) { return this.tx(store, 'readwrite', s => { s.delete(k); }); },
  keys(store) { return this.tx(store, 'readonly', s => this.req(s.getAllKeys())); },
  all(store) { return this.tx(store, 'readonly', s => this.req(s.getAll())); },
  clear(store) { return this.tx(store, 'readwrite', s => { s.clear(); }); }
};

/* ============ Clés de champs (même algorithme que dgs_fill.py) ============ */
function normKey(token) {
  let s = token.slice(1, -1).normalize('NFD').replace(/\p{Mn}/gu, '');
  s = s.replace(/°/g, '').replace(/’/g, ' ').replace(/'/g, ' ');  // même convention que le catalogue (extract_fields.py)
  s = s.replace(/[^A-Za-z0-9]+/g, '_').replace(/^_+|_+$/g, '').toUpperCase().replace(/_+/g, '_');
  if (!s) return null;
  if (/^\d/.test(s)) s = 'F_' + s;
  return s;
}
